[package]
name = "citrus-daemon"
version = "1.0.0"
edition = "2021"
authors = ["Tangerine-Linux Architecture Team"]
description = "100% offline, zero-click contextual file converter, media processor, redaction tool, and floating file shelf for Linux"

[dependencies]
async-channel = "2.3"
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
cairo-rs = "0.20"
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
chrono = "0.4"
dirs = "5.0"
once_cell = "1.19"
url = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "ico", "tiff"] }
rqrr = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
libc = "0.2"
