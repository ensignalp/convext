<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="180" height="180">
  <defs>
    <!-- GNOME Adwaita Dark Glass Squircle Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E222D"/>
      <stop offset="55%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#0C0E14"/>
    </linearGradient>

    <!-- Convext Electric Citrus & GNOME Blue Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7800"/>
      <stop offset="50%" stop-color="#FF4B2B"/>
      <stop offset="100%" stop-color="#3584E4"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62A0EA"/>
      <stop offset="100%" stop-color="#1C71D8"/>
    </linearGradient>

    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA348"/>
      <stop offset="100%" stop-color="#E66100"/>
    </linearGradient>

    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer GNOME Squircle Icon Base -->
  <rect x="16" y="16" width="208" height="208" rx="48" ry="48" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="3.5" filter="url(#dropShadow)"/>

  <!-- Subtle Inner Frosted Highlight -->
  <rect x="24" y="24" width="192" height="192" rx="42" ry="42" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5"/>

  <!-- Cascading Context Menu Card 1 (Left / Primary) -->
  <rect x="42" y="52" width="96" height="114" rx="16" fill="#242936" stroke="#3584E4" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="54" y="68" width="54" height="10" rx="5" fill="#62A0EA" opacity="0.9"/>
  <rect x="54" y="88" width="72" height="14" rx="7" fill="url(#orangeGrad)"/>
  <path d="M 116 92 L 121 95 L 116 98 Z" fill="#FFFFFF"/>
  <rect x="54" y="112" width="60" height="8" rx="4" fill="#9A9996" opacity="0.45"/>
  <rect x="54" y="128" width="46" height="8" rx="4" fill="#9A9996" opacity="0.35"/>
  <rect x="54" y="144" width="64" height="8" rx="4" fill="#9A9996" opacity="0.25"/>

  <!-- Cascading Context Menu Card 2 (Right / Nested Submenu) -->
  <rect x="114" y="82" width="88" height="110" rx="16" fill="#2E3444" stroke="url(#orangeGrad)" stroke-width="2.2" filter="url(#dropShadow)"/>
  <rect x="126" y="98" width="64" height="12" rx="6" fill="url(#blueGrad)"/>
  <rect x="126" y="118" width="52" height="9" rx="4.5" fill="#FFFFFF" opacity="0.85"/>
  <rect x="126" y="135" width="60" height="9" rx="4.5" fill="#FFFFFF" opacity="0.55"/>
  <rect x="126" y="152" width="44" height="9" rx="4.5" fill="#FFFFFF" opacity="0.4"/>
  <rect x="126" y="169" width="56" height="9" rx="4.5" fill="#FFFFFF" opacity="0.3"/>

  <!-- Central Lightning / Conversion Bolt Badge -->
  <circle cx="114" cy="136" r="24" fill="#141720" stroke="url(#accentGrad)" stroke-width="3"/>
  <path d="M 118 119 L 104 137 L 114 137 L 110 153 L 125 134 L 115 134 Z" fill="url(#orangeGrad)" filter="url(#glow)"/>
</svg>
